<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>管理画面へ移動します</title>
<!--
  管理画面（CMS）の本体は1つ上の admin.html だけ。
  このファイルは「/admin/」（末尾にスラッシュ）で開かれたときに admin.html へ送るためだけのもの。
  以前は admin.html と同じ中身のコピーだったが、片方だけ直し忘れる事故が起きたので転送だけにした。
  ここに管理画面のコードを戻さないこと。
-->
<meta http-equiv="refresh" content="0; url=../admin.html">
<script>location.replace('../admin.html' + location.search + location.hash);</script>
</head>
<body>
<p><a href="../admin.html">管理画面へ移動します</a></p>
</body>
</html>
